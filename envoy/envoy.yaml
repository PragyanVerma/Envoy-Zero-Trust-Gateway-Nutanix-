admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 10000
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          generate_request_id: true
          tracing:
            provider:
              name: envoy.tracers.opentelemetry
              typed_config:
                "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                grpc_service:
                  envoy_grpc:
                    cluster_name: jaeger_cluster
                  timeout: 0.25s
                service_name: envoy-gateway
          route_config:
            name: local_route
            virtual_hosts:
            - name: backend
              domains: ["*"]
              routes:
              - match:
                  prefix: "/"
                  headers:
                  - name: "x-route-to"
                    string_match:
                      exact: "sandbox"
                route:
                  cluster: sandbox_backend
                  retry_policy:
                    retry_on: "5xx,connect-failure,reset"
                    num_retries: 2
                    per_try_timeout: 2s
              - match:
                  prefix: "/"
                route:
                  cluster: backend_service
                  retry_policy:
                    retry_on: "5xx,connect-failure,reset"
                    num_retries: 2
                    per_try_timeout: 2s
          http_filters:
          - name: envoy.filters.http.jwt_authn
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
              providers:
                hackathon_provider:
                  issuer: hackathon-issuer
                  audiences:
                  - hackathon-audience
                  payload_in_metadata: jwt_payload
                  local_jwks:
                    inline_string: '{"keys": [{"kty": "RSA", "n": "td8eBNTVdr_y5Teh9swb4CG7ERTBMTaTatfVbLQaX0F31_Lm02geFz1MG_mjEGsB_Jmbc_K0LH0F58SiA6ra-qEQIvrmx9UwlVJJINviGveLlhaPy5V7WRVIQdz49aftJXGTlNLuC6XOXoyCq0xZEg3Y4MZk-9RCOiWhvkozbuWMvxjoGzRK8Subeb7as46Dxc8igDMW1XdsvBzDje0EFdqgVVddqRLY-5w2MbuaZg9bSbIBzFdIqdHqMmYalNuI0-AsIFJo9RFSY4wVzNoO6uXpm2kSi8c-qNxHiNhw2O_rg9jFF_qbgd12IwxFKr1ntlvSQslIpCH5ENRVgGVZQQ", "e": "AQAB"}]}'
              rules:
              - match:
                  prefix: "/"
                requires:
                  provider_name: hackathon_provider
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              clear_route_cache: true
              transport_api_version: V3
              http_service:
                server_uri:
                  uri: http://auth-service:8000
                  cluster: auth_service_cluster
                  timeout: 0.5s
                authorization_request:
                  allowed_headers:
                    patterns:
                    - exact: x-caller-id
                    - exact: x-envoy-original-path
                  headers_to_add:
                  - key: x-forwarded-jwt-claims
                    value: "%DYNAMIC_METADATA(envoy.filters.http.jwt_authn:jwt_payload)%"
                authorization_response:
                  allowed_upstream_headers:
                    patterns:
                    - exact: x-route-to
                    - exact: x-trust-score
                  allowed_client_headers_on_success:
                    patterns:
                    - exact: x-trust-score
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: backend_service
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    circuit_breakers:
      thresholds:
      - max_connections: 100
        max_pending_requests: 50
        max_requests: 100
        max_retries: 3
    outlier_detection:
      consecutive_5xx: 3
      interval: 10s
      base_ejection_time: 30s
      max_ejection_percent: 50
    load_assignment:
      cluster_name: backend_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: backend
                port_value: 5000
  - name: sandbox_backend
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    circuit_breakers:
      thresholds:
      - max_connections: 100
        max_pending_requests: 50
        max_requests: 100
        max_retries: 3
    outlier_detection:
      consecutive_5xx: 3
      interval: 10s
      base_ejection_time: 30s
      max_ejection_percent: 50
    load_assignment:
      cluster_name: sandbox_backend
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: sandbox-backend
                port_value: 5000
  - name: auth_service_cluster
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    circuit_breakers:
      thresholds:
      - max_connections: 100
        max_pending_requests: 50
        max_requests: 100
        max_retries: 3
    outlier_detection:
      consecutive_5xx: 3
      interval: 10s
      base_ejection_time: 30s
      max_ejection_percent: 50
    load_assignment:
      cluster_name: auth_service_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: auth-service
                port_value: 8000
  - name: jaeger_cluster
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    load_assignment:
      cluster_name: jaeger_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: jaeger
                port_value: 4317
